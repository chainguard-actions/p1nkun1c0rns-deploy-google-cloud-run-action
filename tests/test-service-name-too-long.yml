name: Test service name too long validation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          # Service name of 55 chars; with image_tag "latest" -> REVISION_PREFIX="v-latest" (8 chars)
          # REVISION_DATE is ~12 chars (-t<epoch>). Total > 62 and STRIP_LENGTH < 0 -> exits 1
          project_id: my-project
          image_name: gcr.io/my-project/my-image
          service_name: this-service-name-is-way-too-long-to-fit-in-cloud-run-rev
          gcp_region: us-central1
          image_tag: latest
      - name: Assert action failed due to service name too long
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail due to service name being too long, but got outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when service name was too long"
