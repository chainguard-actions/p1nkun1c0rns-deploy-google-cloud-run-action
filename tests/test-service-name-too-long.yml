name: Test action fails when service name is too long
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # A 60-character service name combined with a short image tag causes
      # COMPOSED_NAME_LENGTH > 62 and STRIP_LENGTH < 0, triggering exit 1
      # before any GCP calls are made.
      - name: Run action with service name that is too long
        id: action
        uses: .
        continue-on-error: true
        with:
          project_id: test-project-id
          image_name: gcr.io/test-project/test-image
          service_name: this-service-name-is-way-too-long-and-exceeds-the-limit-here
          gcp_region: us-central1
          image_tag: "1.0"

      - name: Assert action failed due to service name length
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail due to service name being too long, but got outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when service name was too long"
