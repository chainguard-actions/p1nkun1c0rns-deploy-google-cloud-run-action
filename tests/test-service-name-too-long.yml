name: Test service name too long validation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with service name that is too long
        id: action
        uses: .
        continue-on-error: true
        with:
          # Service name is 55 chars — combined with revision date (~12 chars) exceeds 62 limit
          # and revision_prefix would need to be stripped to negative length → exit 1
          project_id: my-project
          image_name: gcr.io/my-project/my-image
          service_name: this-service-name-is-way-too-long-for-cloud-run-deploy
          gcp_region: us-central1
          image_tag: "1.0.0"
      - name: Assert action failed due to service name length
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail due to service name being too long"
            exit 1
          fi
          echo "PASS: action correctly failed due to service name length"
