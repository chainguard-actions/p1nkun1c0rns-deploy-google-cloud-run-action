name: Test error when service name is too long
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Reset mock call log
        run: rm -f "$GITHUB_WORKSPACE/gcloud-calls.log"
      - id: action
        uses: .
        continue-on-error: true
        env:
          BASH_ENV: tests/fixtures/mock-gcloud.sh
        with:
          project_id: my-project
          image_name: gcr.io/my-project/my-image
          # 60 chars: overflow exceeds revision prefix length -> exit 1
          service_name: abcdefghijabcdefghijabcdefghijabcdefghijabcdefghijabcdefghij
          gcp_region: us-central1
          image_tag: 1.2.3
      - name: Assert action failed before deploying
        env:
          OUTCOME: ${{ steps.action.outcome }}
          REV: ${{ steps.action.outputs.cloud_run_revision }}
        run: |
          echo "outcome: $OUTCOME"
          echo "revision: '$REV'"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for too-long service name"
            exit 1
          fi
          if [ -n "$REV" ]; then
            echo "FAIL: no revision output expected"
            exit 1
          fi
          LOG="$GITHUB_WORKSPACE/gcloud-calls.log"
          if [ -f "$LOG" ] && grep -q '^gcloud run deploy' "$LOG"; then
            echo "FAIL: deploy must not be attempted"
            exit 1
          fi
          echo "PASS"
