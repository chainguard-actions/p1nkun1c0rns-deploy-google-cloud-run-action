name: Test service name too long validation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        # The action should fail because the service name is too long to produce
        # a valid Cloud Run revision name (limit: 62 chars).
        # service_name (50 chars) + revision_prefix (v1-0-0 = 6 chars) + revision_date (~12 chars) > 62
        # AND the overflow exceeds the revision_prefix length, so STRIP_LENGTH < 0 → exit 1
        uses: .
        continue-on-error: true
        with:
          project_id: "test-project"
          image_name: "gcr.io/test-project/my-image"
          image_tag: "1.0.0"
          service_name: "this-service-name-is-way-too-long-for-cloud-run-deploy"
          gcp_region: "us-central1"
      - name: Assert action failed due to service name too long
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail due to service name being too long"
            exit 1
          fi
          echo "PASS: action correctly failed when service name was too long"
