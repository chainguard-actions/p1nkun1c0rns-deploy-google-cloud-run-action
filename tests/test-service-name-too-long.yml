name: Test service name too long fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Prepare fake gcloud
        run: |
          chmod +x "$GITHUB_WORKSPACE/tests/fixtures/fakebin/gcloud"
          rm -rf "$GITHUB_WORKSPACE/.gcloud-calls"
          mkdir -p "$GITHUB_WORKSPACE/.gcloud-calls"
      - id: action
        uses: .
        continue-on-error: true
        env:
          PATH: /github/workspace/tests/fixtures/fakebin:/google-cloud-sdk/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
        with:
          project_id: my-project
          image_name: gcr.io/my-project/my-image
          service_name: this-service-name-is-way-too-long-to-be-deployed-on-cloud-run
          gcp_region: europe-west1
      - name: Assert action failed without deploying
        env:
          OUTCOME: ${{ steps.action.outcome }}
          REVISION: ${{ steps.action.outputs.cloud_run_revision }}
        run: |
          echo "outcome: $OUTCOME"
          echo "revision: '$REVISION'"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure for overly long service name"
            exit 1
          fi
          if [ -n "$REVISION" ]; then
            echo "FAIL: no revision output expected"
            exit 1
          fi
          if [ -f "$GITHUB_WORKSPACE/.gcloud-calls/calls.log" ] && grep -q '^gcloud run deploy' "$GITHUB_WORKSPACE/.gcloud-calls/calls.log"; then
            echo "FAIL: gcloud run deploy should not have been called"
            exit 1
          fi
          echo "PASS"
