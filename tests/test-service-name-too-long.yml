name: Test service name too long validation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # A service name of 55 chars + revision_date (~12 chars) > 62 limit,
      # and revision_prefix (e.g. "vlatest"=7 chars) cannot absorb the overflow,
      # so the script exits with code 1 before any gcloud call.
      - id: action
        uses: .
        continue-on-error: true
        with:
          project_id: my-project
          image_name: gcr.io/my-project/my-image
          service_name: this-service-name-is-way-too-long-for-cloud-run-deploy
          gcp_region: us-central1
          image_tag: latest

      - name: Assert action failed due to service name too long
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail due to service name too long, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed for overly long service name"
