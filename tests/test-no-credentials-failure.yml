---
name: Test action fails without GCP credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Set up a git origin reachable inside the Docker container
      - name: Set up a git origin reachable inside the Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      # Without GCP credentials, the action should fail when attempting to deploy.
      # service_account_key is omitted (empty by default), so gcloud auth is skipped.
      # The action will fail at 'gcloud run deploy' due to missing authentication.
      # This verifies the action starts, processes inputs, and fails at the expected point.
      - id: action
        uses: .
        continue-on-error: true
        with:
          project_id: "fake-project"
          image_name: "gcr.io/fake-project/fake-image"
          service_name: "my-service"
          gcp_region: "us-central1"
          image_tag: "latest"

      - name: Assert action failed without credentials
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail without GCP credentials, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed without GCP credentials"
