name: Test action fails without GCP credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      # Without a service_account_key and without ambient GCP credentials,
      # the action should fail when it tries to call gcloud run deploy.
      - id: action
        uses: .
        continue-on-error: true
        with:
          project_id: my-test-project
          service_account_key: ''
          image_name: gcr.io/my-test-project/my-app
          image_tag: '1.0.0'
          service_name: my-app
          gcp_region: us-central1
          allow_unauthenticated: 'true'
          cpu: '1'
          memory: '256Mi'
          max_instances: '5'
          min_instances: '0'
          request_timeout: '30s'

      - name: Assert action failed due to missing GCP credentials
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail without GCP credentials"
            exit 1
          fi
          echo "PASS: action correctly failed without GCP credentials"
