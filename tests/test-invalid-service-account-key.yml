name: Test - Invalid service account key (expected failure)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - name: Create a fake (invalid) base64-encoded service account key
        id: fake-key
        run: |
          # Create a fake JSON key that looks like a service account key but is invalid
          FAKE_KEY=$(echo '{"type":"service_account","project_id":"fake-project","private_key_id":"abc123","private_key":"-----BEGIN RSA PRIVATE KEY-----\nMIIEowIBAAKCAQEA0Z3VS5JJcds3xHn/ygWep4PAtEsHAqnTBKFMFBFMFBFMFBFM\n-----END RSA PRIVATE KEY-----\n","client_email":"fake@fake-project.iam.gserviceaccount.com","client_id":"123456789","auth_uri":"https://accounts.google.com/o/oauth2/auth","token_uri":"https://oauth2.googleapis.com/token"}' | base64 -w 0)
          echo "fake_key=$FAKE_KEY" >> $GITHUB_OUTPUT

      - id: action
        uses: .
        continue-on-error: true
        with:
          project_id: 'fake-project'
          service_account_key: ${{ steps.fake-key.outputs.fake_key }}
          image_name: 'gcr.io/fake-project/fake-image'
          service_name: 'fake-service'
          gcp_region: 'us-central1'
          image_tag: '1.0.0'
          allow_unauthenticated: 'true'
          debug: 'false'

      - name: Assert action failed (invalid service account key)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid service account key, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed with invalid service account key"
