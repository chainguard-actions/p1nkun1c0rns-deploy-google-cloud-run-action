name: Test image_tag_pattern input processing
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # When image_tag_pattern is set (and image_tag is empty), the action
      # attempts to resolve the tag via gcloud container images list-tags.
      # Without real GCP credentials this fails, but it exercises the
      # image_tag_pattern code path in entrypoint.sh.
      - id: action
        uses: .
        continue-on-error: true
        with:
          project_id: my-test-project
          image_name: gcr.io/my-test-project/my-service
          service_name: my-service
          gcp_region: us-central1
          image_tag_pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'

      - name: Assert action failed (expected without GCP credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail without GCP credentials, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed without GCP credentials (image_tag_pattern path)"
