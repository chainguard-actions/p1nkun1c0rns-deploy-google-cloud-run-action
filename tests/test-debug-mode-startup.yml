name: Test debug mode startup
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with debug enabled (no credentials)
        id: action
        uses: .
        continue-on-error: true
        with:
          project_id: my-project
          image_name: gcr.io/my-project/my-image
          service_name: my-service
          gcp_region: us-central1
          image_tag: "1.0.0"
          debug: "true"
      - name: Assert action failed (expected without real GCP credentials)
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail without real GCP credentials"
            exit 1
          fi
          echo "PASS: action correctly failed without GCP credentials (debug mode ran)"
