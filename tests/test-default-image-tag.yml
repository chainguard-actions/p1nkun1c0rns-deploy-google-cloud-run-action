name: Test default image tag (latest) when no tag specified
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # When neither image_tag nor image_tag_pattern is provided, the action
      # defaults to 'latest'. The action will fail at gcloud deploy (no real
      # GCP credentials), but we verify it fails (not panics or errors early).
      - id: action
        uses: .
        continue-on-error: true
        with:
          project_id: fake-project-id
          image_name: gcr.io/fake-project-id/fake-image
          service_name: my-service
          gcp_region: europe-west1
          # image_tag intentionally omitted — should default to 'latest'

      - name: Assert action failed at gcloud (not at input validation)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail without GCP credentials, but got '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed at gcloud stage (default image_tag=latest path exercised)"
