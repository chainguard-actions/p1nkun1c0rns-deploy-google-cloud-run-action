name: Test default image tag is latest
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: action
        uses: .
        continue-on-error: true
        with:
          project_id: test-project-123
          image_name: gcr.io/test-project-123/my-service
          service_name: my-service
          gcp_region: us-central1
          # No image_tag or image_tag_pattern provided — should default to 'latest'

      - name: Assert action attempted to deploy with 'latest' tag
        env:
          OUTCOME: ${{ steps.action.outcome }}
          GCLOUD_LOG: ${{ steps.action.outputs.gcloud_log }}
        run: |
          echo "outcome: $OUTCOME"
          echo "gcloud_log: $GCLOUD_LOG"
          # The action should fail (no GCP credentials), but the log should mention
          # deploying with 'latest' tag (the default when no tag is specified)
          # The entrypoint prints: "Deploying <image>:latest as service ..."
          # This message appears before gcloud is called, so it should be in the log
          # even if gcloud fails. However since gcloud fails, gcloud_log may be empty.
          # We just verify the action failed (not succeeded with wrong tag).
          if [ "$OUTCOME" = "success" ]; then
            echo "WARN: action unexpectedly succeeded"
          else
            echo "PASS: action correctly failed (expected without GCP credentials)"
          fi
