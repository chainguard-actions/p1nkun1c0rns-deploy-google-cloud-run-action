name: Test debug mode fails gracefully without GCP credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          project_id: my-test-project
          image_name: gcr.io/my-test-project/my-image
          service_name: my-debug-service
          gcp_region: europe-west1
          image_tag: "2.0.0"
          debug: "true"
          allow_unauthenticated: "false"
          cpu_throttling: "false"
          startup_boost: "true"
          min_instances: "1"
          max_instances: "5"
          memory: "512Mi"
          cpu: "2"
          concurrency_per_instance: "40"
          request_timeout: "30s"
      - name: Assert action failed due to missing GCP credentials even in debug mode
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail without GCP credentials in debug mode, but got outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed in debug mode when GCP credentials were not provided"
