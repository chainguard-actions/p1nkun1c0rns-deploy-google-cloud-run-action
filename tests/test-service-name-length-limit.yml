name: Test service name length limit enforcement
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: action
        uses: .
        continue-on-error: true
        with:
          project_id: test-project-123
          image_name: gcr.io/test-project-123/my-service
          # service_name is 55 chars (aaaa...a), image_tag produces a short revision prefix
          # service_name (55) + revision_prefix (v1-0-0 = 6) + timestamp (~12) = 73 > 62
          # OVERFLOW = 73 - 62 = 11, STRIP_LENGTH = 6 - 11 = -5 < 0 -> error
          service_name: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          gcp_region: us-central1
          image_tag: 1.0.0

      - name: Assert action failed due to service name too long
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail due to service name too long, but got: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly rejected overly long service name"
