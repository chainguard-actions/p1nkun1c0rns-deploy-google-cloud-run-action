name: Test no-unauthenticated access option
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: action
        uses: .
        continue-on-error: true
        with:
          project_id: test-project-123
          image_name: gcr.io/test-project-123/my-service
          service_name: my-service
          gcp_region: us-central1
          image_tag: v1.0.0
          allow_unauthenticated: 'false'
          cpu_throttling: 'false'
          startup_boost: 'true'
          no_traffic: 'true'
          min_instances: '1'
          max_instances: '5'
          memory: '512Mi'
          cpu: '2'
          concurrency_per_instance: '40'
          request_timeout: '30s'

      - name: Assert action failed (no GCP credentials) with correct inputs accepted
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail at gcloud deploy (no credentials), not at input parsing
          # This verifies all the input flags are accepted without script errors
          if [ "$OUTCOME" = "success" ]; then
            echo "WARN: action unexpectedly succeeded"
          else
            echo "PASS: action correctly processed inputs and failed at gcloud (expected)"
          fi
