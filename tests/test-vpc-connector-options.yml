name: Test VPC connector options
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: action
        uses: .
        continue-on-error: true
        with:
          project_id: test-project-123
          image_name: gcr.io/test-project-123/my-service
          service_name: my-service
          gcp_region: us-central1
          image_tag: v1.0.0
          vpc_connector: my-vpc-connector
          vpc_egress: all-traffic
          ingress: internal
          cloudsql_instances: 'my-project:us-central1:my-db'
          execution_environment: gen2

      - name: Assert action failed at gcloud (not at input parsing)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail at gcloud deploy (no credentials), not at input parsing
          # This verifies VPC connector, egress, ingress, cloudsql, and execution_environment
          # inputs are all accepted without script errors
          if [ "$OUTCOME" = "success" ]; then
            echo "WARN: action unexpectedly succeeded"
          else
            echo "PASS: action correctly processed VPC/CloudSQL inputs and failed at gcloud (expected)"
          fi
