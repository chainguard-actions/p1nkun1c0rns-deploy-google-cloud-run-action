---
name: Test no-traffic and authenticated-only flags
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Set up a git origin reachable inside the Docker container
      - name: Set up a git origin reachable inside the Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      # Test with no_traffic=true, allow_unauthenticated=false, cpu_throttling=false,
      # startup_boost=true, and custom resource limits. The action processes these flags
      # before calling gcloud, so we can verify the action starts and fails at gcloud.
      - id: action
        uses: .
        continue-on-error: true
        with:
          project_id: "fake-project"
          image_name: "gcr.io/fake-project/fake-image"
          service_name: "my-private-service"
          gcp_region: "europe-west1"
          image_tag: "2.0.0"
          allow_unauthenticated: "false"
          cpu_throttling: "false"
          startup_boost: "true"
          no_traffic: "true"
          concurrency_per_instance: "50"
          cpu: "2"
          memory: "512Mi"
          max_instances: "5"
          min_instances: "1"
          request_timeout: "30s"

      - name: Assert action failed as expected (no credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail without GCP credentials, but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed without GCP credentials with no-traffic and private flags"
