name: Test no_traffic flag and optional inputs
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      # Test with no_traffic=true, cpu_throttling=false, startup_boost=true,
      # and allow_unauthenticated=false. These flags affect the gcloud command
      # arguments but the action will still fail without GCP credentials.
      - id: action
        uses: .
        continue-on-error: true
        with:
          project_id: my-test-project
          service_account_key: ''
          image_name: gcr.io/my-test-project/my-svc
          image_tag: '3.1.4'
          service_name: my-svc
          gcp_region: us-east1
          no_traffic: 'true'
          cpu_throttling: 'false'
          startup_boost: 'true'
          allow_unauthenticated: 'false'
          concurrency_per_instance: '50'
          cpu: '2'
          memory: '512Mi'
          max_instances: '20'
          min_instances: '1'
          request_timeout: '60s'

      - name: Assert action failed (expected without credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail without GCP credentials"
            exit 1
          fi
          echo "PASS: action correctly failed without GCP credentials (no_traffic path)"
