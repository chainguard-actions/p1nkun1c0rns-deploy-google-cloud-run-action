name: Test no-traffic flag (deploy without shifting traffic)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Run action with no_traffic flag set
        id: action
        uses: .
        continue-on-error: true
        with:
          project_id: my-project
          image_name: gcr.io/my-project/my-image
          service_name: my-service
          gcp_region: us-central1
          image_tag: "2.0.0"
          no_traffic: "true"
          allow_unauthenticated: "false"
          cpu_throttling: "false"
          startup_boost: "true"
          min_instances: "1"
          max_instances: "5"
          memory: "512Mi"
          cpu: "2"
          concurrency_per_instance: "40"
          request_timeout: "30s"
      - name: Assert action failed (expected without real GCP credentials)
        run: |
          echo "outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail without real GCP credentials"
            exit 1
          fi
          echo "PASS: action correctly failed without GCP credentials (no_traffic path exercised)"
