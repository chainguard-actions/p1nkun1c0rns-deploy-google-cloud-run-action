name: Test authentication with service account key
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Reset mock call log
        run: rm -f "$GITHUB_WORKSPACE/gcloud-calls.log" "$GITHUB_WORKSPACE/key.json"
      - id: action
        uses: .
        env:
          BASH_ENV: tests/fixtures/mock-gcloud.sh
        with:
          project_id: my-project
          # base64 of {"type":"service_account"}
          service_account_key: eyJ0eXBlIjoic2VydmljZV9hY2NvdW50In0=
          image_name: gcr.io/my-project/my-image
          service_name: svc
          gcp_region: us-central1
          image_tag: 1.0.0
      - name: Show mock calls
        run: cat "$GITHUB_WORKSPACE/gcloud-calls.log"
      - name: Assert auth performed and key cleaned up
        run: |
          LOG="$GITHUB_WORKSPACE/gcloud-calls.log"
          if ! grep -q '^gcloud auth activate-service-account --key-file=key.json --project=my-project' "$LOG"; then
            echo "FAIL: activate-service-account not called as expected"
            exit 1
          fi
          if [ -f "$GITHUB_WORKSPACE/key.json" ]; then
            echo "FAIL: key.json was not removed"
            exit 1
          fi
          echo "PASS"
      - name: Assert deployed
        env:
          ACTUAL: ${{ steps.action.outputs.deployed_image_tag }}
        run: |
          echo "actual: $ACTUAL"
          if [ "$ACTUAL" != "1.0.0" ]; then
            echo "FAIL: expected '1.0.0'"
            exit 1
          fi
          echo "PASS"
