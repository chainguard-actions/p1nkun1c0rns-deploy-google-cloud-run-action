name: Test SET_ENV_ and SET_SECRET_ propagation
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Reset mock call log
        run: rm -f "$GITHUB_WORKSPACE/gcloud-calls.log"
      - id: action
        uses: .
        env:
          BASH_ENV: tests/fixtures/mock-gcloud.sh
          SET_ENV_FOO: bar
          SET_SECRET_DB: DB_PASSWORD=db-password:latest
        with:
          project_id: my-project
          image_name: gcr.io/my-project/my-image
          service_name: svc
          gcp_region: us-central1
          image_tag: v2
      - name: Show mock calls
        run: cat "$GITHUB_WORKSPACE/gcloud-calls.log"
      - name: Assert env vars and secrets flags
        run: |
          LOG="$GITHUB_WORKSPACE/gcloud-calls.log"
          DEPLOY="$(grep '^gcloud run deploy ' "$LOG")"
          echo "deploy call: $DEPLOY"
          if ! echo "$DEPLOY" | grep -qF -- "--set-env-vars=^---__---^FOO=bar"; then
            echo "FAIL: missing --set-env-vars with FOO=bar"
            exit 1
          fi
          if ! echo "$DEPLOY" | grep -qF -- "--set-secrets=DB_PASSWORD=db-password:latest"; then
            echo "FAIL: missing --set-secrets"
            exit 1
          fi
          if echo "$DEPLOY" | grep -qF -- "--clear-env-vars"; then
            echo "FAIL: --clear-env-vars should not be present"
            exit 1
          fi
          if echo "$DEPLOY" | grep -qF -- "--clear-secrets"; then
            echo "FAIL: --clear-secrets should not be present"
            exit 1
          fi
          echo "PASS"
      - name: Assert outputs
        env:
          TAG: ${{ steps.action.outputs.deployed_image_tag }}
          REV: ${{ steps.action.outputs.cloud_run_revision }}
        run: |
          echo "tag: $TAG rev: $REV"
          if [ "$TAG" != "v2" ]; then echo "FAIL: tag"; exit 1; fi
          if ! echo "$REV" | grep -qE '^svc-vv2-t[0-9]+$'; then echo "FAIL: revision"; exit 1; fi
          echo "PASS"
