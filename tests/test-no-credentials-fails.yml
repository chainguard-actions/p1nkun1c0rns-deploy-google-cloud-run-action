name: Test action fails without GCP credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          project_id: my-test-project
          image_name: gcr.io/my-test-project/my-image
          service_name: my-test-service
          gcp_region: us-central1
          image_tag: "1.0.0"
          # No service_account_key provided — gcloud will fail without credentials
      - name: Assert action failed due to missing GCP credentials
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail without GCP credentials, but got outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when GCP credentials were not provided"
