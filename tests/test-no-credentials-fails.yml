name: Test action fails without GCP credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Run action (expected to fail without real GCP credentials)
        id: action
        uses: .
        continue-on-error: true
        with:
          project_id: test-project-id
          image_name: gcr.io/test-project/test-image
          service_name: test-service
          gcp_region: us-central1
          image_tag: latest

      - name: Assert action failed (no credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail without GCP credentials, but got outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed without GCP credentials"
