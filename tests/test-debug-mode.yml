name: Test action debug mode
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # With debug=true the entrypoint prints "=== gcloud version ===" before
      # attempting any GCP operations. The action will fail without real
      # credentials, but the debug output should still appear.
      - name: Run action with debug enabled (expected to fail without GCP credentials)
        id: action
        uses: .
        continue-on-error: true
        with:
          project_id: test-project-id
          image_name: gcr.io/test-project/test-image
          service_name: test-service
          gcp_region: us-central1
          image_tag: latest
          debug: "true"

      - name: Assert action failed (no credentials, debug mode)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail without GCP credentials in debug mode, but got outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed without GCP credentials even in debug mode"
