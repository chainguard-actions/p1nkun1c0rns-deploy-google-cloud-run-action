name: Test - Debug mode enabled (expected failure without credentials)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up git origin reachable inside Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - id: action
        uses: .
        continue-on-error: true
        with:
          project_id: 'fake-project-id'
          image_name: 'gcr.io/fake-project/fake-image'
          service_name: 'fake-service'
          gcp_region: 'us-central1'
          image_tag: '1.0.0'
          allow_unauthenticated: 'true'
          debug: 'true'

      - name: Assert action failed (debug mode, no credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail without GCP credentials in debug mode, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed without GCP credentials even in debug mode"
