name: Test debug mode input
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        # With debug=true, the action prints gcloud version before proceeding.
        # The action will fail at gcloud deploy (no real GCP credentials),
        # but the debug flag should be processed without error before that.
        uses: .
        continue-on-error: true
        with:
          project_id: "test-project"
          image_name: "gcr.io/test-project/my-image"
          image_tag: "2.3.4"
          service_name: "debug-service"
          gcp_region: "europe-west1"
          debug: "true"
      - name: Assert action ran (failed at gcloud, not at startup)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          # The action should fail at gcloud deploy (no credentials), not at startup.
          # Any outcome other than 'skipped' means the action ran.
          if [ "$OUTCOME" = "skipped" ]; then
            echo "FAIL: action was skipped, expected it to run"
            exit 1
          fi
          echo "PASS: action ran with debug=true (outcome: $OUTCOME)"
