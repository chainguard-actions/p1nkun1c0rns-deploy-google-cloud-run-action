name: Test debug mode flag processing
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # With debug=true the action prints gcloud version at startup.
      # Without real GCP credentials it still fails at gcloud run deploy,
      # but this validates the debug input is accepted and processed.
      - id: action
        uses: .
        continue-on-error: true
        with:
          project_id: my-test-project
          image_name: gcr.io/my-test-project/my-service
          service_name: my-service
          gcp_region: us-central1
          image_tag: '1.0.0'
          debug: 'true'

      - name: Assert action failed (expected without GCP credentials)
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail without GCP credentials, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed without GCP credentials (debug mode)"
