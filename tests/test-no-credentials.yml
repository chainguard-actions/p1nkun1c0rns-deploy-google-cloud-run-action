name: Test action fails gracefully without GCP credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        # Without a service_account_key, the action skips auth and attempts
        # to run gcloud commands with no active account, which should fail.
        uses: .
        continue-on-error: true
        with:
          project_id: "test-project"
          image_name: "gcr.io/test-project/my-image"
          image_tag: "1.0.0"
          service_name: "my-service"
          gcp_region: "us-central1"
          service_account_key: ""
      - name: Assert action failed due to missing credentials
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail without GCP credentials"
            exit 1
          fi
          echo "PASS: action correctly failed without GCP credentials"
