name: Test action fails gracefully without GCP credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Without real GCP credentials, the action should fail at the gcloud deploy
      # step. The gcloud describe call is wrapped in set+e so it won't abort early.
      # This validates the action is correctly wired and processes all inputs.
      - id: action
        uses: .
        continue-on-error: true
        with:
          project_id: my-test-project
          image_name: gcr.io/my-test-project/my-service
          service_name: my-service
          gcp_region: us-central1
          image_tag: '1.0.0'
          concurrency_per_instance: '80'
          cpu: '1'
          memory: '256Mi'
          max_instances: '10'
          min_instances: '0'
          request_timeout: '10s'
          allow_unauthenticated: 'true'
          cpu_throttling: 'true'
          startup_boost: 'false'
          no_traffic: 'false'
          ingress: 'all'
          debug: 'false'

      - name: Assert action failed without credentials
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail without GCP credentials, but got outcome=$OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed without GCP credentials"
