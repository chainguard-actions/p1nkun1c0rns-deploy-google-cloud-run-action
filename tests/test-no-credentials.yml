name: Test action fails without GCP credentials
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Without valid GCP credentials, the action should fail when trying to
      # run gcloud commands. We verify the action fails (not succeeds silently).
      - id: action
        uses: .
        continue-on-error: true
        with:
          project_id: fake-project-id
          image_name: gcr.io/fake-project-id/fake-image
          service_name: my-test-service
          gcp_region: us-central1
          image_tag: v1.0.0

      - name: Assert action failed due to missing credentials
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail without valid GCP credentials, but got outcome '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed when no GCP credentials were provided"
